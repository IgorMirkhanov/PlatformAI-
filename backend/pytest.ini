[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning

[coverage:run]
source = app
omit =
    app/workers/*
    */__init__.py

[coverage:report]
precision = 1
show_missing = true
skip_covered = true
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
    raise NotImplementedError
