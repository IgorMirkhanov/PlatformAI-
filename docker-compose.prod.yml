# MP.AI production orchestration
#   cp .env.production.example .env.production && ./deploy.sh
# Monitoring: ENABLE_MONITORING=1 ./deploy.sh

name: mpai-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-20m}
    max-file: ${LOG_MAX_FILES:-5}

x-backend-env: &backend-env
  PYTHONPATH: /app
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
  CELERY_INBOUND_QUEUE: ${CELERY_INBOUND_QUEUE:-inbound_messages}
  CELERY_CRM_QUEUE: ${CELERY_CRM_QUEUE:-crm_actions}
  CELERY_QUEUES: ${CELERY_QUEUES:-inbound_messages,crm_actions}
  CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-4}
  CELERY_TASK_ALWAYS_EAGER: "false"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL}
  NGROK_TUNNEL_URL: ${NGROK_TUNNEL_URL:-}
  CORS_ORIGINS: ${CORS_ORIGINS}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_FREE_MODEL: ${OPENROUTER_FREE_MODEL:-meta-llama/llama-3.2-3b-instruct:free}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
  GROQ_CHAT_MODEL: ${GROQ_CHAT_MODEL:-openai/gpt-oss-20b}
  FALLBACK_LLM_PROVIDER: ${FALLBACK_LLM_PROVIDER:-groq}
  FALLBACK_LLM_MODEL: ${FALLBACK_LLM_MODEL:-openai/gpt-oss-20b}
  LLM_PROVIDER: ${LLM_PROVIDER:-auto}
  OPERATOR_WS_TOKEN: ${OPERATOR_WS_TOKEN}
  # Required + distinct from ENCRYPTION_KEY (deploy.sh / checklist §2.2). No fallback.
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
  CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-${CREDENTIALS_ENCRYPTION_KEY:-}}
  INTERNAL_SERVICE_API_KEY: ${INTERNAL_SERVICE_API_KEY:?INTERNAL_SERVICE_API_KEY is required}
  ENVIRONMENT: ${ENVIRONMENT:-production}
  REGISTER_WALLET_STARTER_CREDITS: ${REGISTER_WALLET_STARTER_CREDITS:-0}
  CHROMA_SERVER_HOST: ${CHROMA_SERVER_HOST:-chromadb}
  CHROMA_SERVER_PORT: ${CHROMA_SERVER_PORT:-8000}
  CHROMA_COLLECTION_NAME: ${CHROMA_COLLECTION_NAME:-knowledge_base_chunks}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
  GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
  WHATSAPP_SERVICE_URL: ${WHATSAPP_SERVICE_URL:-http://whatsapp_service:3001}
  WHATSAPP_SERVICE_WS_URL: ${WHATSAPP_SERVICE_WS_URL:-ws://whatsapp_service:3001}
  SENTRY_DSN: ${SENTRY_DSN:-}
  AI_GUARDRAILS_ENABLED: ${AI_GUARDRAILS_ENABLED:-true}
  AI_MODERATION_ENABLED: ${AI_MODERATION_ENABLED:-false}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-120/minute}
  LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-45}
  RAG_SEARCH_TIMEOUT_SECONDS: ${RAG_SEARCH_TIMEOUT_SECONDS:-8}
  ALLOW_SOFT_LAUNCH_AUTH: ${ALLOW_SOFT_LAUNCH_AUTH:-false}
  ALLOW_PLAIN_CREDENTIAL_FALLBACK: ${ALLOW_PLAIN_CREDENTIAL_FALLBACK:-false}
  ALLOW_OAUTH_STUB: ${ALLOW_OAUTH_STUB:-false}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [mpai_net]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${PG_CPU_LIMIT:-2.0}"
          memory: ${PG_MEM_LIMIT:-2G}
        reservations:
          memory: ${PG_MEM_RESERVE:-512M}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  pgbouncer:
    image: bitnami/pgbouncer:1.22.1
    restart: unless-stopped
    profiles: ["pgbouncer"]
    env_file: [.env.production]
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DATABASE: ${POSTGRES_DB}
      POSTGRESQL_USERNAME: ${POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: "1000"
      PGBOUNCER_DEFAULT_POOL_SIZE: "50"
      PGBOUNCER_MIN_POOL_SIZE: "10"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [mpai_net]
    expose: ["5432"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: [.env.production]
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-1gb}
      --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    networks: [mpai_net]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPU_LIMIT:-1.0}"
          memory: ${REDIS_MEM_LIMIT:-768M}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  chromadb:
    image: chromadb/chroma:0.5.23
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/chroma/chroma
    expose: ["8000"]
    networks: [mpai_net]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${CHROMA_CPU_LIMIT:-1.5}"
          memory: ${CHROMA_MEM_LIMIT:-2G}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/heartbeat', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend_api:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: mpai-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      <<: *backend-env
    entrypoint: ["/app/scripts/docker-entrypoint-api.sh"]
    expose: ["8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    networks: [mpai_net]
    logging: *default-logging
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${API_CPU_LIMIT:-2.0}"
          memory: ${API_MEM_LIMIT:-2G}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthcheck', timeout=5)",
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 120s

  whatsapp_service:
    build:
      context: ./whatsapp-service
      dockerfile: Dockerfile
    image: mpai-whatsapp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      NODE_ENV: production
      PORT: ${WHATSAPP_SERVICE_PORT:-3001}
      HOST: "0.0.0.0"
      LOG_LEVEL: ${WHATSAPP_LOG_LEVEL:-info}
      SESSIONS_DIR: /app/whatsapp-sessions
      FASTAPI_WEBHOOK_URL: ${WHATSAPP_FASTAPI_WEBHOOK_URL:-http://backend_api:8000/api/v1/webhooks/whatsapp-qr}
      INTERNAL_SERVICE_API_KEY: ${INTERNAL_SERVICE_API_KEY:-}
    volumes:
      - whatsapp_sessions:/app/whatsapp-sessions
    expose: ["3001"]
    depends_on:
      backend_api:
        condition: service_healthy
    networks: [mpai_net]
    logging: *default-logging
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: "${WA_CPU_LIMIT:-1.0}"
          memory: ${WA_MEM_LIMIT:-1G}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: mpai-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      <<: *backend-env
      CELERY_HOSTNAME: celery@%h
    entrypoint: ["/app/scripts/docker-entrypoint-celery.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend_api:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      whatsapp_service:
        condition: service_started
    networks: [mpai_net]
    logging: *default-logging
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: "${CELERY_CPU_LIMIT:-2.0}"
          memory: ${CELERY_MEM_LIMIT:-2G}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.core.celery_app inspect ping -d celery@$$HOSTNAME -t 5 2>/dev/null | grep -q pong || celery -A app.core.celery_app inspect ping -t 5 2>/dev/null | grep -q pong",
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 50s

  frontend_app:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_OPERATOR_WS_TOKEN: ${NEXT_PUBLIC_OPERATOR_WS_TOKEN}
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend_api:8000}
    image: mpai-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend_api:8000}
      NEXT_PUBLIC_OPERATOR_WS_TOKEN: ${NEXT_PUBLIC_OPERATOR_WS_TOKEN}
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      HOST: "0.0.0.0"
    command: ["sh", "-c", "HOSTNAME=0.0.0.0 PORT=3000 exec node server.js"]
    expose: ["3000"]
    depends_on:
      backend_api:
        condition: service_healthy
    networks: [mpai_net]
    logging: *default-logging
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: "${FE_CPU_LIMIT:-1.0}"
          memory: ${FE_MEM_LIMIT:-1G}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/mpai.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_locations.conf:/etc/nginx/proxy_locations.conf:ro
      - ${SSL_CERT_PATH:-./nginx/ssl/fullchain.pem}:/etc/nginx/ssl/fullchain.pem:ro
      - ${SSL_KEY_PATH:-./nginx/ssl/privkey.pem}:/etc/nginx/ssl/privkey.pem:ro
      - ${CERTBOT_WEBROOT:-./nginx/certbot}:/var/www/certbot:ro
    depends_on:
      frontend_app:
        condition: service_healthy
      backend_api:
        condition: service_healthy
      whatsapp_service:
        condition: service_started
    networks: [mpai_net]
    logging: *default-logging
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: "${NGINX_CPU_LIMIT:-0.5}"
          memory: ${NGINX_MEM_LIMIT:-256M}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-127.0.0.1:9090}:9090"
    depends_on:
      backend_api:
        condition: service_healthy
    networks: [mpai_net]
    logging: *default-logging

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-CHANGE_ME_GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:3002}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_HOST_PORT:-127.0.0.1:3002}:3000"
    depends_on: [prometheus]
    networks: [mpai_net]
    logging: *default-logging

  cadvisor:
    profiles: ["monitoring"]
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    expose: ["8080"]
    networks: [mpai_net]
    logging: *default-logging

networks:
  mpai_net:
    driver: bridge
    name: mpai_net

volumes:
  pg_data:
    name: mpai_pg_data
  redis_data:
    name: mpai_redis_data
  chroma_data:
    name: mpai_chroma_data
  whatsapp_sessions:
    name: mpai_whatsapp_sessions
  prometheus_data:
    name: mpai_prometheus_data
  grafana_data:
    name: mpai_grafana_data
