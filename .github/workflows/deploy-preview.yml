name: Deploy Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# Preview deploys are environment-specific. This workflow builds images and
# publishes an artifact; wire your host (Fly/Render/GHCR+SSH) in the TODO steps.

jobs:
  build-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          tags: mpai-backend:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false
          tags: mpai-frontend:pr-${{ github.event.pull_request.number }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_OPERATOR_WS_TOKEN=preview-token
            API_INTERNAL_URL=http://backend_api:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Preview comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '### Preview build ready',
                `- Images: \`mpai-backend:pr-${{ github.event.pull_request.number }}\`, \`mpai-frontend:pr-${{ github.event.pull_request.number }}\``,
                '- Next: push to your registry / staging host (configure secrets `PREVIEW_HOST`, `PREVIEW_SSH_KEY`).',
                '- OpenAPI: `/docs` on the preview API once deployed.',
              ].join('\n')
            })
