# CI — lint, test (cov≥75%), build, security scans, optional e2e

name: CI

on:
  push:
    branches: [main, master, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Ruff
        run: ruff check app main.py || true
      - name: Concurrency gates (wallet / CRM / OAuth)
        env:
          CI: "true"
          CELERY_TASK_ALWAYS_EAGER: "true"
          ENVIRONMENT: test
          JWT_SECRET_KEY: ci-test-jwt-secret-key-32chars!!
          ENCRYPTION_KEY: "dGVzdC1lbmNyeXB0aW9uLWtleS0zMmJ5dGVzISE="
          CREDENTIALS_ENCRYPTION_KEY: "dGVzdC1lbmNyeXB0aW9uLWtleS0zMmJ5dGVzISE="
        run: >
          pytest -q --tb=short
          tests/unit/test_wallet_repository.py
          tests/stress/test_wallet_isolation.py
          tests/stress/test_deal_idempotency.py
          tests/integration/test_oauth_refresh_race.py
      - name: Pytest with coverage
        env:
          CELERY_TASK_ALWAYS_EAGER: "true"
          ENVIRONMENT: test
          JWT_SECRET_KEY: ci-test-jwt-secret-key-32chars!!
          ENCRYPTION_KEY: "dGVzdC1lbmNyeXB0aW9uLWtleS0zMmJ5dGVzISE="
          CREDENTIALS_ENCRYPTION_KEY: "dGVzdC1lbmNyeXB0aW9uLWtleS0zMmJ5dGVzISE="
          AI_GUARDRAILS_ENABLED: "true"
        run: >
          pytest -q --tb=short
          --cov=app.services.quota_service
          --cov=app.services.stripe_billing_service
          --cov=app.services.analytics_service
          --cov=app.services.usage_service
          --cov=app.services.flow_execution_service
          --cov=app.services.rag_service
          --cov-config=.coveragerc
          --cov-report=term-missing:skip-covered
          --cov-report=xml
          --cov-fail-under=75
        # Full app/ is still ~21%; gate is GA-critical billing/execution modules.
        # ai_guardrails covered by unit tests but omitted from fail-under aggregate.
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: npm audit (high+)
        run: npm audit --audit-level=high || true
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_OPERATOR_WS_TOKEN: ci-token
          API_INTERNAL_URL: http://127.0.0.1:8000

  e2e:
    name: Playwright smoke (mocked API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run wallet / BYOK / saas-v1 e2e
        run: npx playwright test e2e/saas-v1-flow.spec.ts e2e/platform-core.spec.ts e2e/wallet-isolation.spec.ts e2e/byok-vault-validation.spec.ts --project=chromium
        env:
          CI: "true"
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_OPERATOR_WS_TOKEN: ci-token
          API_INTERNAL_URL: http://127.0.0.1:8000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/v') }}
      - name: Trivy filesystem
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/v') }}
      - name: Pip audit (backend)
        working-directory: backend
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --strict
      - name: npm audit (frontend)
        working-directory: frontend
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
