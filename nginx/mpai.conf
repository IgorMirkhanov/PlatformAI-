# =============================================================================
# MP.AI Production Nginx — single source of truth
# Mounted as: /etc/nginx/nginx.conf  (docker-compose.prod.yml → nginx)
#
# Routing matrix:
#   /                              → frontend_app:3000   (Next.js)
#   /api/v1/                       → backend_api:8000    (FastAPI REST)
#   /api/v1/ws/  and  /ws/         → backend_api:8000    (Operator Live Chat)
#   WhatsApp QR/API                → ONLY via FastAPI proxy (not public)
#   /.well-known/acme-challenge/   → Certbot webroot
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    server_tokens       off;
    client_max_body_size 50M;

    # --------------------------------------------------------------------------
    # Compression (gzip always; brotli requires ngx_brotli — not in stock alpine)
    # For brotli, swap image to fholzer/nginx-brotli and uncomment modules below.
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_static on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/xhtml+xml
        image/svg+xml
        font/woff2;

    # --------------------------------------------------------------------------
    # Rate / connection limits
    # --------------------------------------------------------------------------
    limit_req_zone  $binary_remote_addr zone=api_limit:20m      rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=ws_limit:10m       rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=auth_limit:10m     rate=5r/s;
    limit_req_zone  $binary_remote_addr zone=whatsapp_limit:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # Docker embedded DNS. Variable proxy_pass (see proxy_locations.conf) re-resolves
    # after frontend_app / backend_api recreate; static upstream{} would cache the old IP
    # and Nginx would 502 with "Connection refused" on :3000 / :8000.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # ==========================================================================
    # HTTP :80 — ACME + healthz + HTTPS redirect
    # ==========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
            allow all;
        }

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Local Docker uses a self-signed cert; serve the app on HTTP so
        # browsers can open http://127.0.0.1 without NET::ERR_CERT_AUTHORITY_INVALID.
        include /etc/nginx/proxy_locations.conf;
    }

    # ==========================================================================
    # HTTPS :443 — app reverse proxy + WebSocket SSL termination
    # ==========================================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;
        ssl_stapling              off;

        # Security headers
        # Skip HSTS on local self-signed deploys so http://127.0.0.1 stays usable.
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
        add_header X-XSS-Protection          "0" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss: http: https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

        include /etc/nginx/proxy_locations.conf;
    }
}
